<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    runpool — fill level.

    A pool with a waterline. The only mark in the set that describes what the
    tool is for: a pool has a level, and capacity is the single thing runpool
    controls.

    Transparent background on purpose, so the mark sits correctly on a light or
    a dark surface without a second variant. No baked-in rounded corners or
    shadow: anything that masks this would otherwise double-round it.

    Source of truth. Render with:
      rsvg-convert -w 512 -h 512 assets/icon.svg -o assets/icon.png
  -->
  <defs>
    <!-- Deliberately inset only 10 from the outer rect, so the water overlaps
         the inner half of the 40px wall rather than stopping at its edge.
         Fill and stroke are the same colour, so an overlap is invisible while
         a gap shows as a hairline arc in the bottom corners. -->
    <clipPath id="basin">
      <rect x="86" y="86" width="340" height="340" rx="90"/>
    </clipPath>
  </defs>

  <rect x="76" y="76" width="360" height="360" rx="100"
        fill="none" stroke="#0a84ff" stroke-width="40"/>

  <g clip-path="url(#basin)">
    <path d="M 56 292 q 40 -34 80 0 t 80 0 t 80 0 t 80 0 t 80 0 V 470 H 56 Z"
          fill="#0a84ff"/>
  </g>
</svg>
